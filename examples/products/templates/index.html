<html><head><title>Product gallery</title><link rel="stylesheet" href="/static/style.css"/></head><body><div class="page"><div class="hero"><h1 class="hero-title">Product gallery</h1><p>Browse the catalog or add something new.</p><a class="primary" href="/products/new">Add a product</a></div><ul class="product-list">{% for product in items %}<li class="card"><img class="product-image" src="{{ product.image_url }}" alt="{{ product.name }}"/><div class="card-content"><h2>{{ product.name }}</h2><p class="price">${{ product.price }}</p><a class="details" href="/products/{{ product.id }}">View details</a><form method="POST" action="/products/{{ product.id }}/delete"><button type="submit">Delete</button></form></div></li>{% endfor %}</ul></div></body></html>
